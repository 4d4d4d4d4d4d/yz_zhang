[project]
name = "signalnet"
version = "0.1.0"
description = "以 Proof of Signal（声誉质押）衡量信息质量的去中心化内容社区"
requires-python = ">=3.11"
dependencies = ["cryptography>=41"]

[project.optional-dependencies]
dev = ["ruff>=0.5"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # 允许中文全角标点
