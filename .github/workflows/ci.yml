name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: 后端测试（pytest）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -q

  frontend:
    name: 前端测试与构建（vitest + tsc + vite）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build:web

  boot-smoke:
    name: 服务启动 + 主闭环冒烟（DEP-060）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: 迁移建库（验证 alembic 路径真的能建出可用的库）
        run: alembic upgrade head
        env:
          PLATFORM_DATABASE_URL: sqlite:///./ci.db
      - name: 启动并探活
        run: |
          uvicorn app.main:app --port 8000 &
          for i in $(seq 1 30); do
            sleep 1
            if curl -sf http://localhost:8000/readyz; then break; fi
            if [ "$i" = "30" ]; then echo "server failed to boot"; exit 1; fi
          done
      - name: 主闭环冒烟（真实 HTTP，跑完一笔交易并核对分账）
        run: python -m scripts.smoke

  sandbox-compliance:
    name: 沙箱合规态闭环（STUB-041）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      # 开发态（mock/internal）与合规态（sandbox/custody）两条路径都必须常绿，
      # 否则只有一条被维护，接真实供应商时另一条就是从没跑过的代码
      - name: 存管 + 可靠签名 + 第三方存证的完整闭环
        run: python -m scripts.sandbox_check

  dependency-audit:
    name: 依赖漏洞扫描（pip-audit + npm audit）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: pip install pip-audit
      - name: Python 依赖
        run: pip-audit -r requirements.txt
        working-directory: server
      - run: npm install --no-audit --no-fund
      # 发给用户的依赖（--omit=dev）是硬闸门：这些代码会进浏览器。
      - name: 前端生产依赖（阻断）
        run: npm audit --omit=dev --audit-level=moderate
      # 构建工具链的漏洞影响的是开发机与 CI，不是用户；报告但不阻断，
      # 免得一条「Vitest UI 服务监听时可被读文件」——一个我们从不启用的功能——
      # 把整条流水线卡死。
      - name: 构建工具链（仅报告）
        run: npm audit || true

  restore-drill:
    name: 备份恢复演练（DRILL-020）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      # 造一笔真实闭环 → 备份 → **删库** → 恢复 → 跑与生产恢复相同的一致性校验。
      # 一份没有恢复过的备份，不是备份，是一个关于备份的假设。
      - run: python -m scripts.restore_drill

  migration-drift:
    name: 迁移与模型一致性（DEP-020，SQLite + Postgres 双引擎）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: drift
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      # SQLite 与 Postgres 的漂移检测能力**不一样**：列的 nullable 差异在
      # SQLite 上 `alembic check` 根本看不出来。只跑 SQLite 等于放行了一整类
      # 会在生产迁移当场失败的问题——V66 就是这么发现两条迁移写错 nullable 的。
      - name: SQLite 路径
        run: alembic upgrade head && alembic check
        env:
          PLATFORM_DATABASE_URL: sqlite:///./drift.db
      - name: Postgres 路径（生产真正跑的引擎）
        run: alembic upgrade head && alembic check
        env:
          PLATFORM_DATABASE_URL: postgresql+psycopg://postgres:ci@localhost:5432/drift

  postgres-acceptance:
    name: Postgres 部署 + 全链路验收（DEP-070）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: acc
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PLATFORM_DATABASE_URL: postgresql+psycopg://postgres:ci@localhost:5432/acc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      - name: 启动
        run: |
          uvicorn app.main:app --port 8000 &
          for i in $(seq 1 40); do sleep 1; curl -sf http://localhost:8000/readyz && break; done
      # 47 项全链路：交易、纠纷答辩、提现风控、上传能力 URL、越权、对账、注销
      - name: 全链路验收
        run: PLATFORM_API_BASE=http://localhost:8000 python -m scripts.acceptance
      # DRILL-061：pg_dump → DROP SCHEMA → psql 恢复，与生产脚本同参数
      - name: Postgres 备份恢复演练
        run: python -m scripts.restore_drill

