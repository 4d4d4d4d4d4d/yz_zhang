[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-repro"
version = "0.1.0"
description = "An open reproduction of World Labs' Atlas: a multimodal autoregressive diffusion transformer over a 3D-grounded spatial context"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.1"]

[project.optional-dependencies]
data = ["pillow", "numpy"]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["atlas*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::FutureWarning"]
