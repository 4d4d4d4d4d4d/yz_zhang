[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "npu_sim"
version = "0.1.0"
description = "NPU simulation platform implementing the v1.0 spec set under docs/specs/"
requires-python = ">=3.11"
authors = [{name = "Architecture Group"}]
dependencies = [
    "jsonschema>=4.0,<5.0",
    "pyyaml>=6.0,<7.0",
    "numpy>=1.24,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0,<9.0",
    "pytest-cov>=4.0",
    "import-linter>=1.12",
]

[tool.setuptools.packages.find]
include = ["npu_sim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
