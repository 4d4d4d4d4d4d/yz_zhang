schema_version: "1.0"
name: "MMU tlb=16 hit_rate=0.5 — baseline"
clock_domains:
  - id: main_clk
    period_ps: 1000
modules:
  - id: prod
    type: Producer
    clock: main_clk
    config: { n_tokens: 4, send_rate_cycles_per_token: 1, payload_size_bytes: 8 }
  - id: mmu
    type: MMU
    clock: main_clk
    config: { tlb_entries: 16, tlb_hit_rate: 0.5, pt_walk_cycles: 20 }
  - id: cons
    type: Consumer
    clock: main_clk
    config: { receive_rate_cycles_per_token: 1 }
connections:
  - { from: prod.out, to: mmu.vaddr_in, fifo_depth: 16, latency_cycles: 1 }
  - { from: mmu.paddr_out, to: cons.in, fifo_depth: 16, latency_cycles: 1 }
