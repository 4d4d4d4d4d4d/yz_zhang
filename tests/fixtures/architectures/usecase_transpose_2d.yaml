schema_version: "1.0"
name: "Transpose 2D — baseline"
clock_domains:
  - id: main_clk
    period_ps: 1000
modules:
  - id: prod
    type: Producer
    clock: main_clk
    config: { n_tokens: 4, send_rate_cycles_per_token: 1, payload_size_bytes: 32 }
  - id: tr
    type: Transpose
    clock: main_clk
    config: { enable_3d: false, element_bytes: 4 }
  - id: cons
    type: Consumer
    clock: main_clk
    config: { receive_rate_cycles_per_token: 1 }
connections:
  - { from: prod.out, to: tr.data_in, fifo_depth: 8, latency_cycles: 1 }
  - { from: tr.data_out, to: cons.in, fifo_depth: 8, latency_cycles: 1 }
