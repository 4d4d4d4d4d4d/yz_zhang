schema_version: "1.0"
name: "SYNC n_participants=2 — baseline barrier"
clock_domains:
  - id: main_clk
    period_ps: 1000
modules:
  - id: prod_a
    type: Producer
    clock: main_clk
    config: { n_tokens: 2, send_rate_cycles_per_token: 1, payload_size_bytes: 8 }
  - id: prod_b
    type: Producer
    clock: main_clk
    config: { n_tokens: 2, send_rate_cycles_per_token: 1, payload_size_bytes: 8 }
  - id: merger
    type: Merger
    clock: main_clk
    config: {}
  - id: sync
    type: SYNC
    clock: main_clk
    config: { n_participants: 2, barrier_overhead_cycles: 2 }
  - id: cons
    type: Consumer
    clock: main_clk
    config: { receive_rate_cycles_per_token: 1 }
connections:
  - { from: prod_a.out, to: merger.in0, fifo_depth: 8, latency_cycles: 1 }
  - { from: prod_b.out, to: merger.in1, fifo_depth: 8, latency_cycles: 1 }
  - { from: merger.out, to: sync.arrive_in, fifo_depth: 16, latency_cycles: 1 }
  - { from: sync.release_out, to: cons.in, fifo_depth: 8, latency_cycles: 1 }
