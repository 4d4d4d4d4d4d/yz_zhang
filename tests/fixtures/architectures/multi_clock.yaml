schema_version: "1.0"
name: "Multi-clock"
description: "Cross-domain connection: fast → slow. Elaborator should mark CDC."

clock_domains:
  - id: main_clk
    period_ps: 1000
  - id: slow_clk
    period_ps: 2000

modules:
  - id: fast
    type: Dummy
    clock: main_clk
    config: { throughput_elems_per_cycle: 2 }
  - id: slow
    type: Dummy
    clock: slow_clk
    config: { throughput_elems_per_cycle: 1 }

connections:
  - { from: fast.out_data, to: slow.in_data, fifo_depth: 8, latency_cycles: 1 }
