schema_version: "1.0"
name: "DAGC external (3D, 10% relocate penalty)"
description: |
  SPEC-003 v1.1 §2.2 / SPEC-007 §6.3 use case: DAGC moved off the main die.
  The variant applies +10% latency, +10% energy, +0% area via __relocate__
  on top of the dagc_chain baseline.

base: dagc_chain.yaml

overrides:
  modules:
    dagc:
      __relocate__:
        from_die: 0
        to_die: 1
        latency_penalty_pct: 10
        energy_penalty_pct: 10
        area_penalty_pct: 0
