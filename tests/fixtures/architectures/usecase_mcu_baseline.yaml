schema_version: "1.0"
name: "MCU baseline — no OGU peer (single-thread)"
description: |
  SPEC-007 §2.5 evaluation baseline: workload flows through one MCU that
  runs the full T_buffsize + T_bd + T_opcfg = 260 cycles per op.

clock_domains:
  - id: main_clk
    period_ps: 1000

modules:
  - id: prod
    type: Producer
    clock: main_clk
    config:
      n_tokens: 8
      send_rate_cycles_per_token: 1
      payload_size_bytes: 8

  - id: mcu_0
    type: MCU
    clock: main_clk
    config:
      has_ogu_peer: false
      threads: 1

  - id: cons
    type: Consumer
    clock: main_clk
    config:
      receive_rate_cycles_per_token: 1

connections:
  - { from: prod.out, to: mcu_0.cmd_in, fifo_depth: 16, latency_cycles: 1 }
  - { from: mcu_0.op_out, to: cons.in, fifo_depth: 16, latency_cycles: 1 }
