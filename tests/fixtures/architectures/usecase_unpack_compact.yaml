schema_version: "1.0"
name: "DAGC unpack chain — compact_unpack enabled (large-token workload)"
description: |
  SPEC-005 v1.1 §U.2 evaluation variant: enables compact_unpack on the
  DAGC. Area should drop (-1980 μm² from the cap delta); per-token latency
  rises by +1 cycle of decode. To make the +5% drain_time bound (§U.2)
  meaningful, the variant uses larger payloads (128 bytes/token at
  throughput=8 → 16 cycles/token baseline; +1 = +6%, close to bound).

clock_domains:
  - id: main_clk
    period_ps: 1000

modules:
  - id: prod
    type: Producer
    clock: main_clk
    config:
      n_tokens: 8
      send_rate_cycles_per_token: 1
      payload_size_bytes: 128

  - id: dagc
    type: DAGC
    clock: main_clk
    config:
      bfp8_unpack_throughput: 8
      bfp16_unpack_throughput: 4
      bfp_ratio: "2:1"
      enable_compact_unpack: true

  - id: cons
    type: Consumer
    clock: main_clk
    config:
      receive_rate_cycles_per_token: 1

connections:
  - { from: prod.out, to: dagc.in_packed, fifo_depth: 4, latency_cycles: 1 }
  - { from: dagc.out_unpacked, to: cons.in, fifo_depth: 4, latency_cycles: 1 }
