schema_version: "1.0"
name: "VAU vector chain"
description: "Producer -> VAU (in_a) -> Consumer. Elementwise unary in the rig."

clock_domains:
  - id: main_clk
    period_ps: 1000

modules:
  - id: prod
    type: Producer
    clock: main_clk
    config:
      n_tokens: 16
      send_rate_cycles_per_token: 1
      payload_size_bytes: 8

  - id: vau
    type: VAU
    clock: main_clk
    config:
      lanes: 16

  - id: cons
    type: Consumer
    clock: main_clk
    config:
      receive_rate_cycles_per_token: 1

connections:
  - { from: prod.out, to: vau.in_a, fifo_depth: 4, latency_cycles: 1 }
  - { from: vau.out, to: cons.in, fifo_depth: 4, latency_cycles: 1 }
