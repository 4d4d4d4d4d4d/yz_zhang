schema_version: "1.0"
name: "AVP activation chain"
description: "Producer -> AVP -> Consumer. Activation stage in the rig."

clock_domains:
  - id: main_clk
    period_ps: 1000

modules:
  - id: prod
    type: Producer
    clock: main_clk
    config:
      n_tokens: 16
      send_rate_cycles_per_token: 2
      payload_size_bytes: 8

  - id: avp
    type: AVP
    clock: main_clk
    config:
      vector_width: 16

  - id: cons
    type: Consumer
    clock: main_clk
    config:
      receive_rate_cycles_per_token: 1

connections:
  - { from: prod.out, to: avp.in_data, fifo_depth: 4, latency_cycles: 1 }
  - { from: avp.out_data, to: cons.in, fifo_depth: 4, latency_cycles: 1 }
