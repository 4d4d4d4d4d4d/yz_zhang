# DEP-001 生产栈：Postgres + Redis + 可扩副本的 API + 单实例 worker + Nginx
#
# 用法：deploy/up.sh（会先做配置自检，别直接 docker compose up）
#
# 与开发栈（根目录 docker-compose.yml）的区别：
#   - 数据库是 Postgres 而非 SQLite（多副本资金安全的前提，见 18-concurrency.md）
#   - 建表走 migrate 一次性容器（alembic upgrade head），API 不再 create_all
#   - api 可 --scale api=N；worker 固定 1 副本，且 job 端点本身还有执行锁兜底
name: task-platform

x-app-env: &app-env
  PLATFORM_ENV: prod
  PLATFORM_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  PLATFORM_REDIS_URL: redis://redis:6379/0
  PLATFORM_JWT_SECRET: ${PLATFORM_JWT_SECRET}
  PLATFORM_JOB_TOKEN: ${PLATFORM_JOB_TOKEN}
  PLATFORM_CORS_ORIGINS: ${PLATFORM_CORS_ORIGINS}
  PLATFORM_PAYMENT_PROVIDER: ${PLATFORM_PAYMENT_PROVIDER}
  PLATFORM_SMS_PROVIDER: ${PLATFORM_SMS_PROVIDER}
  PLATFORM_KYC_PROVIDER: ${PLATFORM_KYC_PROVIDER}
  PLATFORM_MODERATION_PROVIDER: ${PLATFORM_MODERATION_PROVIDER}
  PLATFORM_GIT_SHA: ${PLATFORM_GIT_SHA:-unknown}
  PLATFORM_LOG_LEVEL: ${PLATFORM_LOG_LEVEL:-INFO}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # DEP-021 迁移由一次性容器执行，避免多副本并发建表
  migrate:
    build: ../server
    environment: *app-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: ../server
    restart: unless-stopped
    environment: *app-env
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      # DEP-011 用就绪探针而非存活探针决定是否导流量
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:8000/readyz').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # DEP-050 定时任务：**固定单副本**（叠加 CONC-040 的 DB 执行锁双保险）
  worker:
    build: ../server
    restart: unless-stopped
    environment:
      <<: *app-env
      PLATFORM_API_BASE: http://api:8000
    command: ["python", "-m", "scripts.cron"]
    depends_on:
      api:
        condition: service_healthy
    deploy:
      replicas: 1

  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
