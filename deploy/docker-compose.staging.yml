# Private integration only: mock providers, no real money or identity data.
name: opc-staging
x-env: &env
  PLATFORM_ENV: test
  PLATFORM_DATABASE_URL: postgresql+psycopg://taskplat:${POSTGRES_PASSWORD:?required}@db:5432/taskplat
  PLATFORM_REDIS_URL: redis://redis:6379/0
  PLATFORM_JWT_SECRET: ${PLATFORM_JWT_SECRET:?required}
  PLATFORM_JOB_TOKEN: ${PLATFORM_JOB_TOKEN:?required}
  PLATFORM_CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:18080,http://127.0.0.1:18080
  PLATFORM_TRUSTED_PROXY_HOPS: '1'
  PLATFORM_UPLOAD_DIR: /srv/data/uploads
  PLATFORM_DB_POOL_SIZE: '3'
  PLATFORM_DB_MAX_OVERFLOW: '2'
  PLATFORM_GIT_SHA: ${PLATFORM_GIT_SHA:-unknown}
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 160m
    environment:
      POSTGRES_USER: taskplat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: taskplat
    command: ['postgres', '-c', 'shared_buffers=32MB', '-c', 'max_connections=30']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U taskplat -d taskplat']
      interval: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 40m
    command: ['redis-server', '--maxmemory', '20mb', '--maxmemory-policy', 'noeviction', '--save', '']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10
  migrate:
    image: opc-api:staging
    build: ../server
    environment: *env
    command: ['alembic', 'upgrade', 'head']
    mem_limit: 220m
    depends_on:
      db: {condition: service_healthy}
  api:
    image: opc-api:staging
    restart: unless-stopped
    mem_limit: 240m
    environment: *env
    volumes: ['uploads:/srv/data/uploads']
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request;urllib.request.urlopen('http://localhost:8000/readyz')"]
      interval: 20s
      timeout: 5s
      retries: 10
  worker:
    image: opc-api:staging
    restart: unless-stopped
    mem_limit: 80m
    environment:
      <<: *env
      PLATFORM_API_BASE: http://api:8000
    command: ['python', '-m', 'scripts.cron']
    depends_on:
      api: {condition: service_healthy}
  web:
    image: nginx:alpine
    restart: unless-stopped
    mem_limit: 40m
    ports: ['127.0.0.1:18080:80']
    volumes:
      - ../web/dist:/usr/share/nginx/html:ro
      - ./nginx.staging.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api: {condition: service_healthy}
volumes:
  pgdata:
  uploads:
