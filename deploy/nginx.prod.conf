# SEC-001~004/010 生产 Nginx：TLS + 网关限流 + 攻击面收敛
#
# 证书由你提供（ACME/Certbot 或云厂商），路径挂载到 /etc/nginx/certs。
# 这份配置解决的是「应用层限流挡不住的那部分」——建连、慢速攻击、
# 以及在请求到达 Python 之前就把明显的洪水拦掉。

# SEC-010 按客户端 IP 的令牌桶。分三档：
#   general 普通接口 / write 写操作 / auth 认证类（最严，撞库与短信轰炸的入口）
limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=write:10m   rate=5r/s;
limit_req_zone $binary_remote_addr zone=auth:10m    rate=1r/s;
limit_conn_zone $binary_remote_addr zone=perip:10m;

# 超出限流时返回 429（默认是 503，语义不对且会误导监控）
limit_req_status 429;
limit_conn_status 429;

server_tokens off;   # SEC-003 不回显 nginx 版本

# HTTP → HTTPS
server {
    listen 80;
    server_name _;
    # ACME 挑战走明文，其余全部跳转
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;   # SEC-001 不支持 1.1 及以下
    ssl_prefer_server_ciphers off;         # TLS1.3 下由客户端选更优
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # SEC-004 请求体与超时：防 Slowloris 一类的慢速耗尽
    client_max_body_size 8m;      # 图片上传上限 2MB，留足余量
    client_body_timeout  10s;
    client_header_timeout 10s;
    send_timeout 30s;
    limit_conn perip 50;

    root /usr/share/nginx/html;
    index index.html;

    # PWA：Service Worker 不能被缓存，否则用户会一直卡在旧版本
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        limit_req zone=general burst=60 nodelay;
        try_files $uri $uri/ /index.html;
    }

    # 认证类：最严的一档。撞库、批量注册、短信轰炸都从这里进
    location ~ ^/api/v1/auth/ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://api:8000;
        include /etc/nginx/proxy_common.conf;
    }

    # 资金类：单独收紧（SEC-013）
    location ~ ^/api/v1/(wallet|contracts)/ {
        limit_req zone=write burst=10 nodelay;
        proxy_pass http://api:8000;
        include /etc/nginx/proxy_common.conf;
    }

    location /api/ {
        limit_req zone=general burst=40 nodelay;
        proxy_pass http://api:8000;
        include /etc/nginx/proxy_common.conf;
    }

    # SEC-003 内部端点绝不对外：指标与 job 健康只允许内网访问
    location ~ ^/(metrics|jobz)$ {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://api:8000;
        include /etc/nginx/proxy_common.conf;
    }
}
